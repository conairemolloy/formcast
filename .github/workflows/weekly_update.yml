name: Weekly Data Update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  weekly-data-update:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest football data
        run: python scripts/ingest_football_data.py

      - name: Fix team names
        run: python scripts/fix_team_names.py

      - name: Run ELO model
        run: python scripts/elo_model.py

      - name: Run tournament simulator
        run: python scripts/tournament_simulator.py

      - name: Run value betting
        run: python scripts/value_betting.py

      - name: Run backtest
        run: python scripts/backtest.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly data update $(date -u +'%Y-%m-%d')"
            git push
          fi
