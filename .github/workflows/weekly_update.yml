name: Weekly Data Update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-data-update:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SKIP_SUPABASE_UPLOAD: 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest football data
        run: python scripts/ingest_football_data.py

      - name: Fix team names
        run: python scripts/fix_team_names.py

      # xG steps continue on error so they never block predictions. The status
      # step below warns on ingest failure (Understat is down) and only fails
      # the run on a merge failure.
      - name: Ingest xG data (Understat)
        id: xg_ingest
        run: python scripts/ingest_xg_data.py
        continue-on-error: true

      - name: Merge xG features into results
        id: xg_merge
        run: python scripts/merge_xg_features.py
        continue-on-error: true

      - name: Run ELO model
        run: python scripts/elo_model.py

      - name: Run corners model
        run: python scripts/corners_model.py

      - name: Run cards model
        run: python scripts/cards_model.py

      - name: Run BTTS model
        run: python scripts/btts_model.py

      - name: Run goals model
        run: python scripts/goals_model.py

      - name: Retrain feedforward neural network
        run: python scripts/neural_network.py

      - name: Retrain LSTM
        run: python scripts/lstm_model.py

      - name: Run Bradley-Terry model
        run: python scripts/bradley_terry.py

      - name: Run Dixon-Coles model
        run: python scripts/dixon_coles.py

      - name: Retrain ensemble (XGBoost + meta-learner)
        run: python scripts/ensemble_v2.py

      - name: Canary — club prediction path smoke test
        run: python scripts/test_club_path.py

      - name: Fetch weather for upcoming fixtures
        run: python scripts/fetch_weather.py
        continue-on-error: true
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Generate ensemble predictions for upcoming fixtures
        run: python scripts/predict_upcoming.py

      - name: Publish predictions (ensemble)
        run: python scripts/publish_predictions.py

      - name: Log odds snapshot
        run: python scripts/log_odds_snapshot.py
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Fetch live odds and value bets
        run: python scripts/fetch_live_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Run tournament simulator
        run: python scripts/tournament_simulator.py

      - name: Run value betting
        run: python scripts/value_betting.py

      - name: Run backtest
        run: python scripts/backtest.py

      - name: Settle predictions
        run: python scripts/settle_predictions.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv data/reference/*.csv models/*.pkl models/*.pt models/feature_cols.json models/holdout_metrics.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly data update $(date -u +'%Y-%m-%d')"
            git push
          fi

      # xG ingest source (Understat) is down indefinitely, so an ingest failure
      # is expected and only warns. A merge failure is a real problem and fails
      # the run. Restore ingest to fatal once xG is migrated to a live source.
      - name: Report xG pipeline status
        if: steps.xg_ingest.outcome == 'failure' || steps.xg_merge.outcome == 'failure'
        run: |
          if [ "${{ steps.xg_ingest.outcome }}" = "failure" ]; then
            echo "::warning title=xG ingest::Understat ingest failed (source down) — xG features skipped this run"
          fi
          if [ "${{ steps.xg_merge.outcome }}" = "failure" ]; then
            echo "::error title=xG merge::merge_xg_features.py failed — see that step's log"
            exit 1
          fi
