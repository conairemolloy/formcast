name: Daily International Data Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-international-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest international data
        run: python scripts/ingest_international_data.py

      - name: Run international ELO model
        run: python scripts/international_elo_model.py

      - name: Run confederation mapping
        run: python scripts/confederation_mapping.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/international_results.csv data/processed/international_elo_ratings.csv data/processed/international_shootouts.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily international data update $(date -u +'%Y-%m-%d')"
            git push
          fi
